name: OpenMM-ML Continuous Integration Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_test:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        configuration: ["cpu", "cuda"]
        requirements: ["mace-aimnet-torchmd", "nequip", "fennix", "orb"]
        include:
          - configuration: "cpu"
            runner: "ubuntu-latest"
            conda-pkgs: ""
            openmm-pkg: "openmm"
          - configuration: "cuda"
            runner: ["self-hosted", "cuda"]
            conda-pkgs: "c-compiler<=1.9.0"
            openmm-pkg: "openmm[cuda12]"
          - requirements: "mace-aimnet-torchmd"
            python-version: "3.14"
          - requirements: "nequip"
            python-version: "3.14"
          - requirements: "fennix"
            python-version: "3.14"
          - requirements: "orb"
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v2
        name: "Checkout the source code"

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: build-env
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ matrix.conda-pkgs }}
          init-shell: bash

      - name: "Install dependencies with pip"
        shell: bash -l {0}
        run: |
          pip install ${{ matrix.openmm-pkg }}
          pip install -v -r devtools/requirements/${{ matrix.requirements }}.txt

      - name: "Install OpenMM-ML"
        shell: bash -l {0}
        run: |
          pip install .

      - name: "Check OpenMM platforms available"
        shell: bash -l {0}
        run: |
          python -m openmm.testInstallation

      - name: "Run tests"
        shell: bash -l {0}
        run: |
          cd test
          pytest -v *

  build_test_emle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v2
        name: "Checkout the source code"

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: build-env
          create-args: >-
            python=${{ matrix.python-version }}
          init-shell: bash

      - name: "Download EMLE-Engine"
        uses: actions/checkout@v2
        with:
          repository: chemle/emle-engine
          path: emle-engine-repository
          # TODO: EMLE-Engine needs to make a release so we can use that instead
          ref: 4585bb3f1df00ab3b38be980d9ed1e7a947d4480

      - name: "Install dependencies with conda"
        shell: bash -l {0}
        run: |
          cd emle-engine-repository
          conda install --file environment.yaml openmm pytest
          pip install .

      - name: "Install OpenMM-ML"
        shell: bash -l {0}
        run: |
          pip install .

      - name: "Run tests"
        shell: bash -l {0}
        run: |
          cd test
          pytest -v *
